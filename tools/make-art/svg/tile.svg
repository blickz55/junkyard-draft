<svg xmlns="http://www.w3.org/2000/svg" width="144" height="144" viewBox="0 0 144 144"><defs><filter id="concrete" filterUnits="userSpaceOnUse" x="0" y="0" width="144" height="144" color-interpolation-filters="sRGB">
