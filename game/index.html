    @font-face { font-family: 'Barlow Condensed'; font-weight: 600 900; font-display: swap; src: url(./fonts/barlow-condensed-latin-700-normal.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }

    #game { position: relative; width: 100%; height: 100%; height: 100dvh; overflow: hidden; }
    #game > canvas { display: block; position: absolute; left: 0; top: 0; image-rendering: auto; touch-action: none; }
  </style>
