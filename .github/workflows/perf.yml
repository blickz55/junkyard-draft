# Performance gate (DOSSIER-v1 0.3.8): runs tools/perf.ts on device preset B (4 GB Chromebook: 1366x768, CPU x6) in
# headless Chromium against the dev server and compares it with the CI baseline committed at
# docs/baselines/ci/perf-ci.json using tools/perf-gate.ts --strict (an empty or unmatched report fails). GitHub runners
# render with software GL, so CI numbers are only comparable with CI numbers: the gate fails on a >25 % script-time
# regression or on a dropped-frame share above the CI baseline's plus 15 % of frames (--dropped-slack 0.15: the software
# renderer's drop count varies by a quarter between identical runs, see STATUS session 51). Two-run rule (0.8.7, STATUS
# session 53): when the first measurement fails the gate, the run is measured once more and only a second failure fails
# the job, because the Canvas sample's drop count has twice exceeded the slack on commits that touched no rendering code
# (65 % of frames on 19ccabd against a 16 % baseline) while a real regression fails both. The baseline was committed from
# this workflow's own artifact on 2026-10-30 (production roadmap 0.8.4), so the gate is armed; to re-baseline after a
# deliberate rendering change, download the perf-ci artifact of a green run on main and commit it at that path.
name: perf
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  perf-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Playwright browser cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - name: Start the dev server
        run: |
          node scripts/dev.mjs > dev-server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:5173/main.js > /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:5173/main.js > /dev/null || { cat dev-server.log; exit 1; }
      - name: Measure device preset B
        run: node --import tsx tools/perf.ts --device B --skip-electron --json perf-ci.json > /dev/null
      - name: Show the report
        run: node -e "const r=require('./perf-ci.json'); for (const s of r.samples) console.log(s.label, JSON.stringify({p50:s.p50,p95:s.p95,dropped:s.dropped,frames:s.frames,script:s.scriptMsPerFrame,cpu:s.cpuMsPerFrame,draws:s.drawsPerFrame,binds:s.bindsPerFrame,texts:s.textObjectsCreated,objects:s.maxObjects,heap:s.heapMB}))"
      - name: Gate against the CI baseline (two-run rule)
        run: |
          BASE=docs/baselines/ci/perf-ci.json
          if [ ! -f "$BASE" ]; then echo "::warning::no CI baseline at $BASE yet; download the perf-ci artifact and commit it there to arm the gate"; exit 0; fi
          if node --import tsx tools/perf-gate.ts perf-ci.json "$BASE" --strict --dropped-slack 0.15; then exit 0; fi
          echo "::warning::the first measurement failed the gate; measuring once more (the software renderer's drop count varies run to run; a real regression fails both)"
          node --import tsx tools/perf.ts --device B --skip-electron --json perf-ci-2.json > /dev/null
          node -e "const r=require('./perf-ci-2.json'); for (const s of r.samples) console.log('second run', s.label, JSON.stringify({p50:s.p50,p95:s.p95,dropped:s.dropped,frames:s.frames,script:s.scriptMsPerFrame,cpu:s.cpuMsPerFrame}))"
          node --import tsx tools/perf-gate.ts perf-ci-2.json "$BASE" --strict --dropped-slack 0.15
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-ci
          path: |
            perf-ci.json
            perf-ci-2.json
          if-no-files-found: ignore
